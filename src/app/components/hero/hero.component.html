<section
  id="hero"
  class="relative min-h-screen flex items-center justify-center overflow-hidden bg-neutral-950"
  [@staggerFade]="visible() ? 'enter' : 'void'"
>
  <div class="absolute inset-0 bg-gradient-to-br from-red-950/60 via-neutral-950 to-neutral-900"></div>
  <div class="absolute inset-0 hero-grid-bg opacity-20"></div>
  <div class="absolute top-1/4 -left-32 w-96 h-96 bg-red-600/20 rounded-full blur-3xl animate-pulse-slow"></div>
  <div class="absolute bottom-1/4 -right-32 w-80 h-80 bg-orange-500/15 rounded-full blur-3xl animate-pulse-slow" style="animation-delay:1.5s"></div>

  <!-- Pizza flotante -->
  <div class="absolute right-0 md:right-8 lg:right-16 top-1/2 -translate-y-1/2 w-72 md:w-96 lg:w-[480px] opacity-90 hero-pizza-float pointer-events-none select-none">
    <img
      src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=800&auto=format&fit=crop"
      alt="Pizzería Kairos"
      class="w-full h-full object-cover rounded-full shadow-2xl shadow-red-900/50 border-4 border-red-700/30"
    />
    <div class="absolute inset-0 rounded-full ring-2 ring-red-500/20 animate-spin-slow"></div>
  </div>

  <!-- Contenido -->
  <div class="relative z-10 container mx-auto px-6 md:px-8 pt-24 pb-16 md:pt-32">
    <div class="max-w-xl">
      <div class="flex flex-wrap gap-2 mb-6 anim-child">
        <span *ngFor="let badge of badges" class="bg-red-600/20 border border-red-500/30 text-red-300 text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wide backdrop-blur-sm">
          {{ badge }}
        </span>
      </div>

      <h1 class="text-5xl md:text-6xl lg:text-7xl font-black leading-none text-white mb-4 anim-child">
        Pizzería<br>
        <span class="text-red-500 italic">Kairos</span>
      </h1>
      <p class="text-neutral-300 text-lg md:text-xl leading-relaxed mb-4 max-w-md anim-child">
        Pizzas artesanales desde <span class="text-red-400 font-bold">$4.50</span> — personal, pequeña, mediana, familiar y extra familiar.
      </p>
      <p class="text-neutral-400 text-base leading-relaxed mb-10 max-w-md anim-child">
        Elige hasta <strong class="text-white">3 ingredientes</strong>: Jamón, Salami, Peperoni, Salchicha, Tocino, Champiñones, Pollo, Carne, Piña o Vegetales.
      </p>

      <div class="flex flex-col sm:flex-row gap-4 anim-child">
        <button
          (click)="scrollToMenu()"
          class="group flex items-center justify-center gap-3 bg-red-600 hover:bg-red-500 text-white font-black text-base px-8 py-4 rounded-full uppercase tracking-wide transition-all duration-300 hover:shadow-2xl hover:shadow-red-500/40 hover:scale-105"
        >
          🍕 Ver Menú Completo
        </button>
        <button
          (click)="scrollToPromos()"
          class="flex items-center justify-center gap-3 bg-transparent hover:bg-white/10 text-white font-black text-base px-8 py-4 rounded-full uppercase tracking-wide border-2 border-white/30 hover:border-white/60 transition-all duration-300"
        >
          📋 Ver Precios
        </button>
      </div>

      <div class="flex gap-8 mt-12 pt-8 border-t border-white/10 anim-child">
        <div>
          <p class="text-3xl font-black text-white">$4.50</p>
          <p class="text-neutral-500 text-xs uppercase tracking-wide">Desde personal</p>
        </div>
        <div class="w-px bg-white/10"></div>
        <div>
          <p class="text-3xl font-black text-white">10</p>
          <p class="text-neutral-500 text-xs uppercase tracking-wide">Ingredientes</p>
        </div>
        <div class="w-px bg-white/10"></div>
        <div>
          <p class="text-3xl font-black text-white">6</p>
          <p class="text-neutral-500 text-xs uppercase tracking-wide">Tamaños</p>
        </div>
      </div>
    </div>
  </div>

  <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 animate-bounce">
    <span class="text-neutral-600 text-xs uppercase tracking-widest">Scroll</span>
    <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
    </svg>
  </div>
</section>
