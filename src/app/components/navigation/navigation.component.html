<header
  [class]="scrolled()
    ? 'fixed top-0 left-0 right-0 z-50 transition-all duration-500 bg-black/70 backdrop-blur-xl border-b border-white/10 shadow-2xl'
    : 'fixed top-0 left-0 right-0 z-50 transition-all duration-500 bg-transparent'"
>
  <div class="container mx-auto px-4 py-4 flex items-center justify-between">

    <!-- Logo -->
    <a href="#" class="flex items-center gap-3 group" (click)="scrollTo('#hero')">
      <div class="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-300">
        <span class="text-white font-black text-lg">🍕</span>
      </div>
      <span class="text-white font-black text-2xl tracking-tight">
        Pizzería<span class="text-red-500">Kairos</span>
      </span>
    </a>

    <!-- Desktop Nav -->
    <nav class="hidden md:flex items-center gap-8">
      <a
        *ngFor="let link of navLinks"
        (click)="scrollTo(link.href)"
        class="text-white/80 hover:text-red-400 font-semibold text-sm uppercase tracking-wider cursor-pointer transition-colors duration-200 relative group"
      >
        {{ link.label }}
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-red-500 group-hover:w-full transition-all duration-300"></span>
      </a>
    </nav>

    <!-- CTA Button -->
    <button
      (click)="scrollTo('#menu')"
      class="hidden md:flex items-center gap-2 bg-red-600 hover:bg-red-500 text-white font-black px-6 py-2.5 rounded-full uppercase tracking-wide text-sm transition-all duration-300 hover:shadow-lg hover:shadow-red-500/30 hover:scale-105"
    >
      Pedir Ahora
    </button>

    <!-- Mobile Hamburger -->
    <button
      (click)="toggleMobile()"
      class="md:hidden text-white p-2 rounded-lg hover:bg-white/10 transition-colors"
      aria-label="Toggle menu"
    >
      <svg *ngIf="!mobileOpen()" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <svg *ngIf="mobileOpen()" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div
    *ngIf="mobileOpen()"
    class="md:hidden bg-black/90 backdrop-blur-xl border-t border-white/10 px-4 py-4 flex flex-col gap-4 animate-fade-down"
  >
    <a
      *ngFor="let link of navLinks"
      (click)="scrollTo(link.href)"
      class="text-white font-semibold text-base py-2 border-b border-white/10 cursor-pointer hover:text-red-400 transition-colors"
    >
      {{ link.label }}
    </a>
    <button
      (click)="scrollTo('#menu')"
      class="bg-red-600 text-white font-black py-3 rounded-full uppercase tracking-wide mt-2"
    >
      Pedir Ahora
    </button>
  </div>
</header>
