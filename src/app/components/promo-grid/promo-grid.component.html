<!-- Tarjetas de tamaños -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-16">
  <div
    *ngFor="let size of sizes"
    [class]="'group relative bg-neutral-800 rounded-2xl overflow-hidden border-2 transition-all duration-400 hover:-translate-y-2 hover:shadow-2xl cursor-pointer ' + size.color + (size.featured ? ' ring-2 ring-offset-2 ring-offset-neutral-950 ring-white/20' : '')"
  >
    <!-- Top color bar -->
    <div [class]="'h-2 w-full ' + size.colorBg"></div>

    <!-- Featured badge -->
    <div *ngIf="size.featured" class="absolute top-4 right-4 bg-yellow-500 text-black text-xs font-black px-3 py-1 rounded-full uppercase tracking-wide">
      ⭐ Más Pedida
    </div>

    <div class="p-6">
      <!-- Name -->
      <h3 class="text-white font-black text-2xl leading-tight mb-1 group-hover:text-red-400 transition-colors duration-300">
        {{ size.name }}
      </h3>
      <p class="text-neutral-500 text-sm mb-5">{{ size.subtitle }}</p>

      <!-- Prices -->
      <div class="space-y-3 mb-5">
        <div *ngIf="size.priceServirse !== '—'" class="flex items-center justify-between bg-neutral-700/50 rounded-xl px-4 py-2.5">
          <span class="text-neutral-400 text-sm font-semibold">🍽️ Para servirse</span>
          <span class="text-white font-black text-xl">{{ size.priceServirse }}</span>
        </div>
        <div *ngIf="size.priceLlevar !== '—'" class="flex items-center justify-between bg-neutral-700/50 rounded-xl px-4 py-2.5">
          <span class="text-neutral-400 text-sm font-semibold">📦 Para llevar</span>
          <span class="text-red-400 font-black text-xl">{{ size.priceLlevar }}</span>
        </div>
        <div *ngIf="size.priceServirse === '—'" class="bg-green-900/30 border border-green-600/30 rounded-xl px-4 py-3 text-center">
          <span class="text-green-400 font-bold text-sm">Precio según preferencia</span>
        </div>
      </div>

      <!-- Ingredients info -->
      <div class="border-t border-white/10 pt-4 space-y-1.5">
        <p class="text-neutral-300 text-sm font-semibold flex items-center gap-2">
          <span class="text-red-400">✓</span> {{ size.ingredients }}
        </p>
        <p *ngIf="size.extraCost" class="text-neutral-500 text-xs flex items-center gap-2">
          <span class="text-yellow-500">+</span> {{ size.extraCost }}
        </p>
      </div>
    </div>
  </div>
</div>

<!-- Ingredientes disponibles -->
<div class="bg-neutral-900 border border-white/10 rounded-2xl p-8">
  <div class="text-center mb-6">
    <h3 class="text-white font-black text-2xl">Ingredientes Disponibles</h3>
    <p class="text-neutral-500 text-sm mt-1">Personaliza tu pizza con lo que más te gusta</p>
  </div>
  <div class="flex flex-wrap justify-center gap-3">
    <span
      *ngFor="let ing of ingredients"
      class="bg-neutral-800 hover:bg-red-600/20 border border-white/10 hover:border-red-500/40 text-neutral-300 hover:text-white text-sm font-semibold px-4 py-2 rounded-full cursor-default transition-all duration-200"
    >
      {{ ing }}
    </span>
  </div>
</div>
